name: Prelaunch quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript checks
        run: npm run lint
      - name: Unit and integrity tests
        run: npm test
      - name: Build GitHub Pages frontend
        env:
          GITHUB_PAGES: 'true'
          VITE_STATIC_SITE: 'true'
        run: npm run build
      - name: Install Playwright browser testing dependencies
        run: |
          npm install --no-save playwright@1.58.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify browser loads RankNova home page
        run: node scripts/browser-smoke.mjs
      - name: Save startup screenshot if browser fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ranknova-browser-startup-debug
          path: browser-startup.png
          if-no-files-found: ignore
      - name: Install Firebase Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund
      - name: Build Firebase Functions
        run: npm --prefix functions run build
      - name: Test Firebase Functions configuration
        run: npm --prefix functions test
      - name: Test Firebase HTTP API, CORS and direct routes
        run: timeout 45s npm --prefix functions run test:http
      - name: Build Cloud Run production container
        run: docker build --tag ranknova-api-smoke .
      - name: Smoke-test running API, CORS and SSRF protection
        run: |
          docker run -d --name ranknova-smoke -p 8080:8080 -e CORS_ALLOWED_ORIGINS=https://mmoavia7861.github.io ranknova-api-smoke
          trap 'docker logs ranknova-smoke || true; docker rm -f ranknova-smoke || true' EXIT
          for i in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:8080/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/health.json
          curl --silent --fail -X OPTIONS http://127.0.0.1:8080/api/audit \
            -H 'Origin: https://mmoavia7861.github.io' \
            -H 'Access-Control-Request-Method: POST' -o /dev/null
          CODE=$(curl --silent -o /tmp/rejected.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/audit \
            -H 'Content-Type: application/json' \
            -d '{"url":"http://127.0.0.1/"}')
          test "$CODE" = "400"
          grep -q 'error' /tmp/rejected.json

