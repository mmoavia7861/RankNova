name: Deploy RankNova frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_mode: ${{ steps.pages.outputs.mode }}
    steps:
      - name: Checkout RankNova publishing repository
        uses: actions/checkout@v4
      - name: Checkout original PDF and image tools source
        uses: actions/checkout@v4
        with:
          repository: mmoavia7861/tools-website
          ref: main
          path: restored-tools
          persist-credentials: false
      - name: Detect Pages publication mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // "legacy"')
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Pages mode: $MODE"
          if [ "$MODE" != "legacy" ] && [ "$MODE" != "workflow" ]; then
            echo "::error::Unsupported Pages mode $MODE"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure restored tools for RankNova Pages path
        working-directory: restored-tools
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          s = p.read_text()
          assert "'/tools-website/'" in s
          p.write_text(s.replace("'/tools-website/'", "'/RankNova/'"))
          p = Path('scripts/prepare-pages-seo.mjs')
          s = p.read_text()
          assert "'/tools-website/'" in s
          p.write_text(s.replace("'/tools-website/'", "'/RankNova/'").replace('/tools-website/admin/', '/RankNova/admin/'))
          PY
      - name: Install dependencies
        working-directory: restored-tools
        run: npm install --no-audit --no-fund
      - name: Build restored PDF, image, and visiting card tools
        working-directory: restored-tools
        env:
          GITHUB_PAGES: 'true'
        run: |
          cp index.source.html index.html
          npm run build
          node scripts/prepare-pages-seo.mjs
          test -d dist/assets
          grep -q '/RankNova/assets/' dist/index.html
          test -f dist/background-remover/index.html
          test -f dist/edit-pdf/index.html
          test -f dist/visiting-card-generator/index.html
          test -f dist/compress-pdf/index.html
      - name: Copy production output into publishing workspace
        run: |
          rm -rf dist
          cp -R restored-tools/dist dist
      - name: Validate generated tool routes and JavaScript assets
        run: |
          test -s dist/index.html
          test -d dist/assets
          for route in background-remover edit-pdf compress-pdf visiting-card-generator image-to-pdf qr-code-generator compress-video; do
            test -s "dist/$route/index.html"
          done
          grep -q '/RankNova/assets/' dist/index.html
          if grep -q '/tools-website/assets/' dist/index.html; then
            echo "::error::Wrong asset base path"; exit 1
          fi
      - name: Publish compiled site for branch-based GitHub Pages
        if: steps.pages.outputs.mode == 'legacy'
        run: |
          cp dist/index.html index.html
          cp dist/404.html 404.html
          rm -rf assets
          cp -R dist/assets assets
          cp dist/robots.txt robots.txt
          cp dist/sitemap.xml sitemap.xml
          for route in about contact privacy-policy terms acceptable-use copyright-dmca qr-code-generator compress-pdf image-to-pdf edit-pdf background-remover visiting-card-generator compress-video blog; do
            rm -rf "$route"
            cp -R "dist/$route" "$route"
          done
          touch .nojekyll
          git add index.html 404.html assets robots.txt sitemap.xml .nojekyll about contact privacy-policy terms acceptable-use copyright-dmca qr-code-generator compress-pdf image-to-pdf edit-pdf background-remover visiting-card-generator compress-video blog
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(pages): publish restored tools and correct RankNova assets'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Avoid Jekyll processing
        run: touch dist/.nojekyll
      - name: Configure Pages
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/configure-pages@v5
      - name: Upload static build
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: needs.build.outputs.pages_mode == 'workflow'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
