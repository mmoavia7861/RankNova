name: Deploy RankNova frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original PDF and image tools source
        uses: actions/checkout@v4
        with:
          repository: mmoavia7861/tools-website
          ref: main
          persist-credentials: false
      - name: Confirm GitHub Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // "unknown"')
          echo "GitHub Pages build type: $BUILD_TYPE"
          if [ "$BUILD_TYPE" = "legacy" ]; then
            echo "Trying to switch Pages from branch publishing to GitHub Actions..."
            if ! gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow; then
              echo "::error::Could not switch Pages automatically. Open Settings > Pages > Build and deployment > Source and select GitHub Actions, then rerun."
              exit 1
            fi
            BUILD_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // "unknown"')
            echo "GitHub Pages build type after update: $BUILD_TYPE"
          fi
          if [ "$BUILD_TYPE" != "workflow" ]; then
            echo "::error::GitHub Pages must use GitHub Actions as the build source. Change it under Settings > Pages."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure restored tools for RankNova Pages path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.ts')
          s = p.read_text()
          assert "'/tools-website/'" in s
          p.write_text(s.replace("'/tools-website/'", "'/RankNova/'"))
          p = Path('scripts/prepare-pages-seo.mjs')
          s = p.read_text()
          assert "'/tools-website/'" in s
          p.write_text(s.replace("'/tools-website/'", "'/RankNova/'").replace('/tools-website/admin/', '/RankNova/admin/'))
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build restored PDF, image, and visiting card tools
        env:
          GITHUB_PAGES: 'true'
        run: |
          cp index.source.html index.html
          npm run build
          node scripts/prepare-pages-seo.mjs
          test -d dist/assets
          grep -q '/RankNova/assets/' dist/index.html
          test -f dist/background-remover/index.html
          test -f dist/edit-pdf/index.html
          test -f dist/visiting-card-generator/index.html
          test -f dist/compress-pdf/index.html
      - name: Avoid Jekyll processing
        run: touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
