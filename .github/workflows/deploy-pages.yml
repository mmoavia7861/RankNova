name: Deploy RankNova frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confirm GitHub Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // "unknown"')
          echo "GitHub Pages build type: $BUILD_TYPE"
          if [ "$BUILD_TYPE" != "workflow" ]; then
            echo "::error::GitHub Pages is set to Deploy from a branch. Open Settings > Pages > Build and deployment > Source and select GitHub Actions, then rerun this workflow."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          VITE_STATIC_SITE: 'true'
          # Set under Settings -> Secrets and variables -> Actions -> Variables.
          # The value is a public HTTPS URL, not a secret.
          VITE_API_BASE_URL: ${{ vars.RANKNOVA_API_BASE_URL }}
        run: npm run build
      - name: Prepare SPA fallback and avoid Jekyll processing
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
